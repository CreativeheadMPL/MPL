<svg width="800" height="800" viewBox="0 0 800 800" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="midnightGlow" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#0E1929" />
      <stop offset="60%" stop-color="#070D16" />
      <stop offset="100%" stop-color="#05080E" />
    </radialGradient>
    <linearGradient id="horizonBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3874B8" stop-opacity="0.1" />
      <stop offset="50%" stop-color="#4B90E2" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#3874B8" stop-opacity="0.1" />
    </linearGradient>
  </defs>
  <rect width="800" height="800" fill="url(#midnightGlow)" />
  <rect x="24" y="24" width="752" height="752" stroke="#121D2C" stroke-width="1" />

  <!-- Midnight Horizon -->
  <line x1="120" y1="420" x2="680" y2="420" stroke="url(#horizonBlue)" stroke-width="1.5" />
  <circle cx="400" cy="360" r="110" fill="#0A1220" stroke="#25436B" stroke-width="1" />
  <circle cx="400" cy="360" r="3" fill="#D4C5A5" />
  
  <!-- Subtle acoustic grid lines -->
  <line x1="400" y1="200" x2="400" y2="580" stroke="#1A2D47" stroke-width="0.75" stroke-dasharray="6 6" />
  <circle cx="400" cy="420" r="40" stroke="#2A4870" stroke-width="0.75" />

  <!-- Typography -->
  <text x="60" y="70" fill="#F5F3EE" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="12" font-weight="700" letter-spacing="0.3em">SAMPLE 04</text>
  <text x="60" y="92" fill="#5E93D1" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="10" font-weight="500" letter-spacing="0.2em">MIDNIGHT HORIZON</text>
  <text x="740" y="740" text-anchor="end" fill="#25436B" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="10" font-weight="500" letter-spacing="0.25em">MOTION PULSE INDIA</text>
</svg>
