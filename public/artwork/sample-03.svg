<svg width="800" height="800" viewBox="0 0 800 800" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="champagneGlow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#1A1813" />
      <stop offset="100%" stop-color="#080808" />
    </radialGradient>
    <linearGradient id="champagneGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5F3EE" />
      <stop offset="50%" stop-color="#D4C5A5" />
      <stop offset="100%" stop-color="#73664A" />
    </linearGradient>
  </defs>
  <rect width="800" height="800" fill="url(#champagneGlow)" />
  <rect x="24" y="24" width="752" height="752" stroke="#25221B" stroke-width="1" />

  <!-- Diagonal Champagne Ray & Prism -->
  <line x1="200" y1="600" x2="600" y2="200" stroke="url(#champagneGradient)" stroke-width="2" />
  <circle cx="400" cy="400" r="180" stroke="#D4C5A5" stroke-width="0.75" stroke-opacity="0.3" stroke-dasharray="4 8" />
  <polygon points="400,260 480,480 320,480" stroke="#D4C5A5" stroke-width="1" fill="#14130F" fill-opacity="0.6" />
  <circle cx="400" cy="406" r="6" fill="#D4C5A5" />

  <!-- Typography -->
  <text x="60" y="70" fill="#F5F3EE" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="12" font-weight="700" letter-spacing="0.3em">SAMPLE 03</text>
  <text x="60" y="92" fill="#D4C5A5" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="10" font-weight="500" letter-spacing="0.2em">CHAMPAGNE RAY</text>
  <text x="740" y="740" text-anchor="end" fill="#807255" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="10" font-weight="500" letter-spacing="0.25em">MOTION PULSE INDIA</text>
</svg>
